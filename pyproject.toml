[project]
name = "realtime-market-data-pipeline-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(name)s] %(message)s"
log_cli_date_format = "%H:%M:%S"
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
